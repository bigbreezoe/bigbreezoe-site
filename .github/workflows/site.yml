name: site
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo. The preview job asks for pull-requests: write itself.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-redirects.mjs
      - run: node scripts/check.mjs
      - name: Redirects file is up to date
        run: git diff --exit-code public/_redirects

  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy preview (branch deploy, not production)
        id: deploy
        run: npx wrangler@4 pages deploy public --project-name bigbreezoe1 --branch "pr-${{ github.event.number }}" | tee out.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const out = require('fs').readFileSync('out.txt','utf8');
            const url = (out.match(/https:\/\/[^\s]+\.pages\.dev/)||[])[0] || '(see Actions log)';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `Preview: ${url}\n\nCheck it, then approve the PR. Merging deploys production.` });

  production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # add a required reviewer (Cris) on this environment for a second gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx wrangler@4 pages deploy public --project-name bigbreezoe1 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
