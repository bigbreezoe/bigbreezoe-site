<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Big Breezoe hero loop</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Archivo";font-weight:400 900;src:url("../fonts/archivo-latin.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 600;src:url("../fonts/jetbrains-mono-latin.woff2") format("woff2")}
html,body{margin:0;background:#0B0D10}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0B0D10}
/* The grid moves exactly one cell per loop, so the last frame meets the first. */
.grid{position:absolute;left:-128px;top:-128px;width:2176px;height:1336px;
  background-image:linear-gradient(rgba(240,168,64,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(240,168,64,.16) 1px,transparent 1px);
  background-size:96px 96px}
.grid.fine{background-image:linear-gradient(rgba(242,239,233,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,239,233,.05) 1px,transparent 1px);background-size:24px 24px}
.mask{position:absolute;inset:0;background:radial-gradient(ellipse 62% 70% at 50% 46%,transparent 0%,rgba(11,13,16,.55) 55%,#0B0D10 88%)}
.glow{position:absolute;left:50%;top:44%;width:1500px;height:900px;margin:-450px 0 0 -750px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(240,168,64,.30),rgba(198,116,48,.10) 42%,transparent 70%)}
.mark{position:absolute;left:50%;top:50%;width:1500px;margin:-83px 0 0 -750px;opacity:.07}
.mark path{fill:none;stroke:#F0A840;stroke-width:1.2}
.scan{position:absolute;left:0;right:0;height:2px;top:0;background:linear-gradient(90deg,transparent,rgba(255,196,106,.55),transparent)}
.node{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;background:#FFC46A;border-radius:2px;opacity:0;box-shadow:0 0 18px 4px rgba(240,168,64,.6)}
</style>
</head>
<body>
<div id="root" data-composition-id="hero-loop" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div id="glow" class="glow"></div>
  <div id="g1" class="grid fine"></div>
  <div id="g2" class="grid"></div>
  <svg class="mark" viewBox="0 0 902 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0,0 h26 v100 h-26 Z M26,0 h38 v22 h-38 Z M42,0 h22 v52 h-22 Z M26,40 h48 v22 h-48 Z M52,40 h22 v60 h-22 Z M26,78 h48 v22 h-48 Z M90,0 h24 v100 h-24 Z M130,0 h26 v100 h-26 Z M156,0 h56 v24 h-56 Z M156,76 h56 v24 h-56 Z M188,48 h24 v52 h-24 Z M174,48 h38 v22 h-38 Z M284,0 h26 v100 h-26 Z M310,0 h38 v22 h-38 Z M326,0 h22 v52 h-22 Z M310,40 h48 v22 h-48 Z M336,40 h22 v60 h-22 Z M310,78 h48 v22 h-48 Z M374,0 h26 v100 h-26 Z M400,0 h48 v22 h-48 Z M426,0 h22 v52 h-22 Z M400,40 h48 v22 h-48 Z M416,62 L454,100 L422,100 L400,70 L400,58 Z M470,0 h24 v100 h-24 Z M494,0 h48 v24 h-48 Z M494,38 h40 v24 h-40 Z M494,76 h48 v24 h-48 Z M558,0 h24 v100 h-24 Z M582,0 h48 v24 h-48 Z M582,38 h40 v24 h-40 Z M582,76 h48 v24 h-48 Z M646,0 h72 v24 h-72 Z M646,76 h72 v24 h-72 Z M694,24 L718,24 L670,76 L646,76 Z M734,0 h80 v24 h-80 Z M734,76 h80 v24 h-80 Z M734,0 h24 v100 h-24 Z M790,0 h24 v100 h-24 Z M830,0 h24 v100 h-24 Z M854,0 h48 v24 h-48 Z M854,38 h40 v24 h-40 Z M854,76 h48 v24 h-48 Z"/></svg>
  <div id="scan" class="scan"></div>
  <div class="mask"></div>
  <div id="n0" class="node" style="left:576px;top:288px"></div>
  <div id="n1" class="node" style="left:1344px;top:384px"></div>
  <div id="n2" class="node" style="left:768px;top:768px"></div>
  <div id="n3" class="node" style="left:1152px;top:672px"></div>
  <div id="n4" class="node" style="left:480px;top:576px"></div>
  <div id="n5" class="node" style="left:1440px;top:768px"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const L = 10;
// Grids drift one cell (96px and 24px) toward the upper left: seamless at the loop point.
tl.fromTo("#g2", { x: 0, y: 0 }, { x: -96, y: -96, duration: L, ease: "none" }, 0);
tl.fromTo("#g1", { x: 0, y: 0 }, { x: -48, y: -24, duration: L, ease: "none" }, 0);
// The glow breathes once per loop and ends where it began.
tl.fromTo("#glow", { opacity: 0.55, scale: 0.94 }, { opacity: 1, scale: 1.04, duration: L / 2, ease: "sine.inOut" }, 0);
tl.to("#glow", { opacity: 0.55, scale: 0.94, duration: L / 2, ease: "sine.inOut" }, L / 2);
// One slow scan from above the frame to below it.
tl.fromTo("#scan", { y: -40, opacity: 0.0 }, { y: 1120, opacity: 0.0, duration: L, ease: "none" }, 0);
tl.to("#scan", { opacity: 1, duration: 2, ease: "sine.out" }, 1);
tl.to("#scan", { opacity: 0, duration: 2, ease: "sine.in" }, 7);
// Six grid nodes light in turn, each fully off again before the loop point.
["#n0", "#n1", "#n2", "#n3", "#n4", "#n5"].forEach((n, i) => {
  const t = 0.6 + i * 1.45;
  tl.fromTo(n, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "sine.out" }, t);
  tl.to(n, { opacity: 0, scale: 0.6, duration: 1.1, ease: "sine.in" }, t + 0.9);
});
tl.set({}, {}, L);
window.__timelines = window.__timelines || {};
window.__timelines["hero-loop"] = tl;
</script>
</body>
</html>
