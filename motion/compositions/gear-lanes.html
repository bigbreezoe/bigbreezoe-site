<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free, best value, premium</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Archivo";font-weight:400 900;src:url("../fonts/archivo-latin.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400 600;src:url("../fonts/jetbrains-mono-latin.woff2") format("woff2")}
html,body{margin:0;background:#0B0D10}
#root{word-spacing:.12em;position:relative;width:1920px;height:1080px;overflow:hidden;background:#0B0D10;color:#F2EFE9;font-family:"Archivo",sans-serif}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(240,168,64,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(240,168,64,.08) 1px,transparent 1px);background-size:96px 96px;
  -webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,#000 25%,transparent 80%)}
.cols{position:absolute;left:150px;right:150px;top:150px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.col{height:560px;border-radius:36px;border:2px solid rgba(242,239,233,.12);background:#14171C;padding:52px 48px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.col::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#F0A840,#C67430);transform-origin:0 50%}
.col .k{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:26px;letter-spacing:.16em;color:#F0A840;position:absolute;left:48px;top:56px}
.col .h{font-weight:900;font-size:92px;line-height:.96;letter-spacing:-.05em}
.col .s{margin-top:22px;font-weight:600;font-size:36px;color:#B7BCC3;letter-spacing:-.01em}
.c2{border-color:rgba(240,168,64,.35)}
.c3{border-color:rgba(240,168,64,.6);background:linear-gradient(180deg,rgba(240,168,64,.10),#14171C 60%)}
.key{position:absolute;left:150px;right:150px;bottom:150px;display:flex;gap:22px;justify-content:center}
.p{font-family:"JetBrains Mono",monospace;font-weight:600;font-size:28px;letter-spacing:.08em;padding:18px 30px;border-radius:999px;border:2px solid}
.p1{color:#F0A840;border-color:rgba(240,168,64,.6);background:rgba(240,168,64,.12)}
.p2{color:#E8A06A;border-color:rgba(198,116,48,.7);background:rgba(198,116,48,.12)}
.p3{color:#B7BCC3;border-color:rgba(242,239,233,.25)}
</style>
</head>
<body>
<div id="root" data-composition-id="gear-lanes" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="grid"></div>
  <div class="cols">
    <div class="col c1" id="c1"><div class="k">LANE 1</div><div class="h">Free</div><div class="s">Costs nothing to start</div></div>
    <div class="col c2" id="c2"><div class="k">LANE 2</div><div class="h">Best value</div><div class="s">Low cost, real upgrade</div></div>
    <div class="col c3" id="c3"><div class="k">LANE 3</div><div class="h">Premium</div><div class="s">Saves the most time</div></div>
  </div>
  <div class="key"><div class="p p1" id="p1">I USE THIS</div><div class="p p2" id="p2">I'VE USED IT</div><div class="p p3" id="p3">RESEARCHED, NOT USED</div></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const E = "power3.out";
["#c1", "#c2", "#c3"].forEach((s, i) => tl.fromTo(s, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: E }, 0.3 + i * 0.9));
["#p1", "#p2", "#p3"].forEach((s, i) => tl.fromTo(s, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: E }, 4.4 + i * 0.4));
tl.set({}, {}, 8);
window.__timelines = window.__timelines || {};
window.__timelines["gear-lanes"] = tl;
</script>
</body>
</html>
